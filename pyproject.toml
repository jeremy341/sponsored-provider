[project]
name = "sponsored-provider"
version = "0.1.0"
description = "A small, budget-controlled OpenAI-compatible Alibaba Model Studio provider."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1"]

[project.scripts]
provider = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["deploy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
